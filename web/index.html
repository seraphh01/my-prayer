<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">

  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Rugaciuni și cântări - CMD">

  <meta name="robots" content="noindex" />

    <link rel="icon" href="favicon.png" sizes="any"/>

  <meta property="og:title" content="Congregația Surorilor Maicii Domnului" />
  <meta property="og:description" content="Congregația Surorilor Maicii Domnului" />
  <meta property="og:image" content="/assets/assets/images/app_launcher_icon.jpg" />
  <meta name="twitter:title" content="Congregația Surorilor Maicii Domnului" />
  <meta name="twitter:description" content="Congregația Surorilor Maicii Domnului" />
  <meta name="twitter:image" content="/assets/assets/images/app_launcher_icon.jpg" />
  <meta name="twitter:card" content="summary_large_image" />

  <title> Congregația Surorilor Maicii Domnului </title>
  <meta name="description" content="Congregația Surorilor Maicii Domnului" />

  <meta name="theme-color" content="#790822">

  <link rel="manifest" href="manifest.json">

  <style>
    #flutter-loading {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 24px;
      padding: 32px;
      box-sizing: border-box;
      background: linear-gradient(180deg, #790822 0%, #3c010c 100%);
      color: #ffe5ad;
      z-index: 9999;
      transition: opacity 240ms ease;
    }

    #flutter-loading.is-hidden {
      opacity: 0;
      pointer-events: none;
    }

    #flutter-loading img {
      width: 96px;
      height: 96px;
      border-radius: 18px;
      object-fit: cover;
    }

    #flutter-loading h1 {
      margin: 0;
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(1.25rem, 4vw, 1.75rem);
      font-weight: 600;
      text-align: center;
      line-height: 1.25;
    }

    #flutter-loading p {
      margin: 0;
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(1rem, 3.5vw, 1.25rem);
      text-align: center;
      line-height: 1.3;
      opacity: 0.92;
    }
  </style>
</head>
<body style="margin:0;background:#790822;">
  <div id="flutter-loading" aria-hidden="true">
    <img src="assets/assets/images/app_launcher_icon.jpg" alt="" width="96" height="96" />
    <div>
      <h1>Rugăciuni și cântări</h1>
      <p>Congregația Surorilor Maicii Domnului</p>
    </div>
  </div>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
